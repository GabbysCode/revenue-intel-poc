# Databricks Apps spec for the RevIntel frontend (Next.js 14, App Router).
#
# Build then serve in prod mode. $DATABRICKS_APP_PORT is injected by the
# platform; bind to it and to 0.0.0.0 so the proxy can reach you. The
# build step happens at app start because Databricks Apps doesn't have a
# separate build phase — it's slow on first deploy but cached after.
command:
  - sh
  - -c
  - "npm ci && npm run build && npm start -- -p $DATABRICKS_APP_PORT -H 0.0.0.0"

env:
  # ---------------------------------------------------------------------------
  # REQUIRED — the backend Databricks App's HTTPS URL. Without this the
  # frontend's /api/[...path]/route.ts proxies to localhost and every API
  # call returns 502.
  # Format: https://revintel-backend-<workspace-id>.<region>.databricksapps.com
  # ---------------------------------------------------------------------------
  - name: BACKEND_UPSTREAM
    value: ""

  # ---------------------------------------------------------------------------
  # REQUIRED for the deployed two-app topology — service-principal OAuth M2M
  # creds the frontend uses to authenticate to the backend's Apps proxy.
  # Without these the backend returns 401 on every /api/* call.
  #
  # The SP needs "Can use" permission on the backend Databricks App. You can
  # reuse the Tellr Pattern C SP if you grant it that permission too — the
  # frontend falls back to TELLR_SP_* and TELLR_WORKSPACE_HOST when the
  # REVINTEL_SP_* vars are unset.
  #
  # Use Apps secrets, not literal values:
  #   databricks apps secrets put-secret revintel-frontend revintel/sp_secret \
  #       --string-value '<the-actual-secret>' -p $PROFILE
  # ---------------------------------------------------------------------------
  - name: REVINTEL_SP_CLIENT_ID
    value: ""
  - name: REVINTEL_SP_CLIENT_SECRET
    valueFrom: "revintel/sp_secret"
  - name: REVINTEL_WORKSPACE_HOST
    value: ""

  # ---------------------------------------------------------------------------
  # Optional polish — see frontend/.env.example for full descriptions.
  # ---------------------------------------------------------------------------
  - name: NEXT_PUBLIC_GENIE_ROOM_URL
    value: ""
  - name: NEXT_PUBLIC_DEMO_ACCESS_CODE
    value: ""
