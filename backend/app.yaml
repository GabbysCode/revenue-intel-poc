# Databricks Apps spec for the RevIntel backend (FastAPI + DuckDB).
#
# Databricks Apps runs `command:` in a managed Python runtime (no Dockerfile
# is executed). $DATABRICKS_APP_PORT is injected by the platform.
#
# Deployment shape: we ship a pre-built wheel under `dist/` and let Apps
# install it with a single pinned-dependencies `pip install`. This is far
# faster than `pip install -r requirements.txt` on cold start, and it
# guarantees the deployed code is exactly what was tested locally — no
# accidental editable-install drift.
#
# Build the wheel before each deploy:
#     make wheel       # at the repo root, drops it into backend/dist/
# or:
#     cd backend && python -m build --wheel --outdir dist
#
# `databricks/deploy.sh` does both for you.
command:
  - sh
  - -c
  - "pip install --no-cache-dir dist/revintel_backend-*.whl && revintel-backend --host 0.0.0.0 --port $DATABRICKS_APP_PORT"

env:
  # ---------------------------------------------------------------------------
  # DuckDB seed file location. Defaults to `<cwd>/data/revintel.duckdb`,
  # which on Databricks Apps lives in the unpacked source dir. Override
  # to /tmp/... if you want the seed to disappear on restart.
  # ---------------------------------------------------------------------------
  - name: REVINTEL_DB_PATH
    value: ""

  # ---------------------------------------------------------------------------
  # Tellr — REQUIRED to enable the "Export to Presentation" button.
  # ---------------------------------------------------------------------------
  - name: TELLR_BASE_URL
    value: ""

  # Pattern C (cross-workspace deploys only). Leave empty when deploying into
  # the SAME workspace as Tellr — Pattern A takes over automatically and no
  # token plumbing is needed.
  - name: TELLR_SP_CLIENT_ID
    value: ""
  - name: TELLR_SP_CLIENT_SECRET
    value: ""
  - name: TELLR_WORKSPACE_HOST
    value: ""

  # ---------------------------------------------------------------------------
  # Genie — optional. Without it the NLP pane uses the local DuckDB engine.
  # ---------------------------------------------------------------------------
  - name: DATABRICKS_HOST
    value: ""
  - name: DATABRICKS_TOKEN
    value: ""
  - name: GENIE_SPACE_ID
    value: ""

  # ---------------------------------------------------------------------------
  # Local-dev-only knobs — leave empty in production.
  # ---------------------------------------------------------------------------
  - name: DATABRICKS_OAUTH_TOKEN
    value: ""
  - name: SIMULATE_PATTERN_A
    value: "false"
